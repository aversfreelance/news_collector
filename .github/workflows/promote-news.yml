name: Promote Pest County news draft to live
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/promote_news.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Promote Pest county news import to live'
          file_pattern: public/import/pest-megye-news.json
