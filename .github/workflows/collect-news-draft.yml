name: Collect Pest County news draft
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/collect_news.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Generate draft Pest county news import'
          file_pattern: public/import/pest-megye-news-draft.json
